# air — hot reload for `make dev`. https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"

[build]
# `make dev` rebuilds + restarts on file changes. Operator-specific args
# (workspace, kubeconfig, dev-login, admin-list) come from env vars the
# binary picks up at startup: $CNPG_PORTAL_WORKSPACE, $KUBECONFIG,
# $CNPG_PORTAL_DEV_LOGIN, $CNPG_PORTAL_ADMIN_LIST. Set them once in
# your shell before `make dev`.
cmd          = "go build -o ./tmp/cnpgctl ./cmd/cnpgctl"
bin          = "./tmp/cnpgctl"
full_bin     = "./tmp/cnpgctl serve --addr 127.0.0.1:8080 --log-format text"
include_ext  = ["go", "templ", "html", "css"]
exclude_dir  = ["tmp", "dist", "bin", "test/integration", ".git", ".github"]
delay        = 500
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
